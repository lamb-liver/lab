name: oneshot-covers

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit-covers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ast-115-114-math-jia-exams
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run covers:exam
      - name: Commit PNGs and cleanup
        run: |
          git config user.name "yang-gan"
          git config user.email "147922854+lamb-liver@users.noreply.github.com"
          git rm -f --ignore-unmatch public/images/exam-covers/_probe-tiny.png public/images/exam-covers/_probe-ascii.txt public/images/exam-covers/_probe-bytes.bin public/images/exam-covers/_probe-push.png public/images/exam-covers/_probe-sig.png .github/workflows/oneshot-exam-covers.yml || true
          git add public/images/exam-covers/ast-115-circle-two-lines-tangent.png public/images/exam-covers/ast-114-plane-parallel-line-distance.png public/images/exam-covers/ast-114-parallelogram-direction-area.png
          git diff --cached --quiet && echo nothing && exit 0
          git commit -m "feat(exam): add AST-115/114 cover PNGs for share preview"
          git push origin HEAD:feat/ast-115-114-math-jia-exams
