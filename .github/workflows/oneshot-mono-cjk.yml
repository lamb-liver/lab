name: One-shot apply mono CJK fallback patch

# 暫時性 workflow：改動橫跨 37 個檔案，MCP push_files 需逐檔全文，改以 patch 帶入後由 CI 提交。
# GITHUB_TOKEN 不能修改 workflow 檔，本檔於 bot commit 之後另以一般 commit 刪除。
on:
  push:
    branches: [fix/font-subset-scan]

permissions:
  contents: write

concurrency:
  group: oneshot-mono-cjk
  cancel-in-progress: false

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/font-subset-scan
          fetch-depth: 0

      - name: Apply patch
        run: |
          set -euo pipefail
          git apply --unidiff-zero .github/oneshot/mono-cjk.patch
          git rm -q -f .github/oneshot/mono-cjk.patch

