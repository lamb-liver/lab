      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "羊肝"
          git config user.email "147922854+lamb-liver@users.noreply.github.com"
          git add -A src
          git status --short
          git commit -m "$(cat <<'EOF'
          fix(fonts): route CJK in monospace labels and canvas text to the Noto Sans TC webfont

          Chrome resolves generic families per script, so zh-Hant text in a stack
          ending in monospace / sans-serif used a system CJK font. Add a CJK-only
          unicode-range alias ('Noto Sans TC CJK', same woff2 files) and put it
          before the generic in --font-mono, every p5 textFont stack and the p5
          host default; Latin and digits keep their monospace / system fonts.
          Drop the now-redundant var(--font-mono), var(--font-sans) rules.
          p5 2.x re-quotes single-quoted names ("'Segoe UI'"), so canvas stacks
          use double quotes. noLoop canvases redraw once webfonts finish loading.
          EOF
          )"
          git push origin HEAD:fix/font-subset-scan
