name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (fatal gate)
        run: npm run typecheck:fatal

      - name: Test
        run: npm test

      - name: Content release audit
        run: npm run audit:content

      - name: Integration audit
        run: npm run audit:integration

      # Shipped woff2 subsets must cover every CJK character in site copy.
      - name: Font glyph coverage
        run: |
          python3 -m pip install --quiet fonttools brotli
          python3 scripts/check-font-glyphs.py

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Some seo-ux cases assert built output under dist/.
      - name: Build
        run: npm run build

      # playwright.config.ts uses channel "chrome"; ubuntu-latest ships Chrome.
      - name: SEO / UX regression suite
        run: npm run test:seo-ux

      # Full sweep: six works shipped broken (truncated const) while only a
      # sampled smoke ran; one dev-server boot covers every work page.
      - name: Works smoke suite
        run: npm run test:works-smoke

      - name: Sampled explore smoke
        run: npm run smoke:explore -- vectors
